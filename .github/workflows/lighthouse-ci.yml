name: Lighthouse CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs to test, separated by commas, spaces, or new lines. Overrides repository variable LHCI_URLS."
        required: false
        type: string
      runs:
        description: "Number of Lighthouse runs per URL."
        required: false
        default: "3"
        type: string

jobs:
  lighthouse:
    name: Lighthouse CI (${{ matrix.form_factor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        form_factor:
          - mobile
          - desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve audit URLs
        shell: bash
        run: |
          URLS="${{ github.event.inputs.urls || vars.LHCI_URLS }}"
          if [ -z "$URLS" ]; then
            echo "::notice::Lighthouse CI skipped. Set repository variable LHCI_URLS or run this workflow manually with URLs."
            echo "LHCI_SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi

          {
            echo "LHCI_URLS<<EOF"
            echo "$URLS"
            echo "EOF"
            echo "LHCI_RUNS=${{ github.event.inputs.runs || vars.LHCI_RUNS || '3' }}"
          } >> "$GITHUB_ENV"

      - name: Run Lighthouse CI
        if: env.LHCI_SKIP != 'true'
        env:
          LHCI_FORM_FACTOR: ${{ matrix.form_factor }}
        run: npm run lhci
